services:
  - type: web
    name: tickway
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VALIDATE_API_KEY
        value: cle_secrete_equipe_terrain_2026
      - key: PAYSECUREHUB_BASE_URL
        value: https://rest-airtime.paysecurehub.com
      - key: PAYSECUREHUB_API_KEY
        sync: false
      - key: PAYSECUREHUB_MERCHANT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tickway-db
          property: connectionString

databases:
  - name: tickway-db
    plan: free
