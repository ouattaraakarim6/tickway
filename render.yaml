services:
  - type: web
    name: tickway
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VALIDATE_API_KEY
        value: cle_secrete_equipe_terrain_2026
      - key: DATABASE_URL
        fromDatabase:
          name: tickway-db
          property: connectionString

databases:
  - name: tickway-db
    plan: free
